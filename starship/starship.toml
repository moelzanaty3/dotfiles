add_newline = true

# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 10

[directory]
truncate_to_repo = true
read_only= "🔒"
truncation_length=1
style = "cyan bold"

[directory.substitutions]
"~/github" = "github.com"

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"

[[battery.display]]
threshold = 30
style = "bold red"

[character]
error_symbol = "[󰅙](bold red) "
success_symbol = "[󰁔](bold #7aa2f7) "

[aws]
disabled = true

[gcloud]
disabled = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "󰘬 "
style = "bold blue"

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
conflicted = "👿"
ahead = "🏎️  💨  ×${count}"
behind = "🐢  ×${count}"
diverged = "🌿 🚀  💨 ×${ahead_count} 🐢 ×${behind_count}"
untracked = "🛤️  ×${count}"
stashed = "📦"
modified = "📝 ×${count}"
staged = "🗃️  ×${count}"
renamed = "📛  ×${count}"
deleted = "🗑️  ×${count}"
style = "bright-white"
format = "$all_status$ahead_behind"

[nodejs]
symbol = "󰎙 "
style = "bold green"
disabled = false
not_capable_style = "bold red"

[golang]
symbol = "󰟓 "
style = "bold blue"

[python]
symbol = "󰌠 "
style = "bold yellow"

[package]
format = "[$symbol$version]($style) "
symbol = "󰏗 "

[line_break]
disabled = true

[cmd_duration]
min_time = 2000
format = "[󱦟 $duration]($style) "
style = "bold yellow"
